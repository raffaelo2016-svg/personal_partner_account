[tool.poetry]
name = "partner-cabinet-backend"
version = "0.1.0"
description = "Backend для партнёрского кабинета URITECH"
authors = ["URITECH"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115"
uvicorn = {version = "^0.34", extras = ["standard"]}
sqlalchemy = "^2.0"
alembic = "^1.14"
asyncpg = "^0.30"
pydantic = {version = "^2.10", extras = ["email"]}
pydantic-settings = "^2.7"
PyJWT = "^2.10"
bcrypt = "^4.2"
structlog = "^24"
slowapi = "^0.1"
python-multipart = ">=0.0.12"
boto3 = "^1.36"
python-docx = "^1.1"
celery = "^5.4"
redis = "^5.2"
websockets = "^14"
httpx = "^0.28"
psycopg2-binary = "^2.9"
yookassa = "^3.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8"
pytest-asyncio = "^0.25"
pytest-cov = "^6"
httpx = "^0.28"
ruff = "^0.9"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["B017"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
disallow_untyped_defs = false
check_untyped_defs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true

[tool.bandit]
exclude_dirs = ["tests", ".venv"]
skips = ["B101"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning:app.services.finance_service",
    "ignore::DeprecationWarning:app.services.task_service",
    "ignore::DeprecationWarning:pytest_asyncio.plugin",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
