services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: partner_cabinet
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d partner_cabinet"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - private
    restart: always

  redis:
    image: redis:7-alpine
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - private
    restart: always

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      # Loopback-only публикация S3-API: нужна, чтобы host nginx мог
      # проксировать presigned-URL (bucket-prefix → MinIO).
      - "127.0.0.1:9000:9000"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      # Backend and MinIO must use the same credential pair. A separate
      # MINIO_PASSWORD silently caused every upload to fail with 403.
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks:
      - private
      # A routable bridge is required for Docker to publish 127.0.0.1:9000.
      # The port remains loopback-only; this network does not expose MinIO.
      - public
    restart: always

  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    env_file: .env
    environment:
      # Prod-значения, которые не должны зависеть от .env на сервере.
      # TrustedHostMiddleware / CORS работают только если домен здесь.
      ENVIRONMENT: production
      ALLOWED_HOSTS: '["finzdorovie.ru","www.finzdorovie.ru","localhost","127.0.0.1"]'
      CORS_ORIGINS: '["https://finzdorovie.ru","https://www.finzdorovie.ru"]'
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      PUBLIC_APP_URL: https://finzdorovie.ru
      # Временно: у агента VL8NCDEP (Масальский) ссылка ведёт на его лендинг,
      # пока не появилась страница партнёрства на основном сайте. Код в ссылке
      # обязателен — по нему заявка на лендинге помечается его кодом.
      AGENT_REFERRAL_OVERRIDES: '{"VL8NCDEP":"https://partner.uriteh.ru/?agent=VL8NCDEP"}'
      # Основной канал отправки — HTTPS API: SMTP-порты недоступны с VPS.
      # API-ключ хранится только в серверном .env.
      RESEND_FROM_EMAIL: "ЮРИТЕХ <noreply@finzdorovie.ru>"
      YOOKASSA_RETURN_URL: https://finzdorovie.ru/dashboard/finance/court-fees
      # Публичный base-URL для presigned S3-ссылок. Путь вида
      # /{bucket}/{key}?X-Amz-... совпадает с nginx location /partner-cabinet/,
      # который pass-through проксирует в MinIO без изменения pathname
      # (чтобы AWS SigV4 подпись не сломалась).
      S3_PUBLIC_ENDPOINT: https://finzdorovie.ru
      S3_ENDPOINT: http://minio:9000
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/partner_cabinet
      REDIS_URL: redis://redis:6379/0
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2", "--proxy-headers", "--forwarded-allow-ips", "172.16.0.0/12,127.0.0.1"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - private
      - public
    restart: always

  celery:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      ENVIRONMENT: production
      ALLOWED_HOSTS: '["finzdorovie.ru","www.finzdorovie.ru","localhost","127.0.0.1"]'
      CORS_ORIGINS: '["https://finzdorovie.ru","https://www.finzdorovie.ru"]'
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/partner_cabinet
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    command: ["celery", "-A", "app.celery_app", "worker", "--loglevel=info"]
    networks:
      - private
      - public
    restart: always

  celery-beat:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    environment:
      ENVIRONMENT: production
      ALLOWED_HOSTS: '["finzdorovie.ru","www.finzdorovie.ru","localhost","127.0.0.1"]'
      CORS_ORIGINS: '["https://finzdorovie.ru","https://www.finzdorovie.ru"]'
      COOKIE_SECURE: "true"
      COOKIE_SAMESITE: lax
      DATABASE_URL: postgresql+asyncpg://app:${DB_PASSWORD}@db:5432/partner_cabinet
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    command: ["celery", "-A", "app.celery_app", "beat", "--loglevel=info"]
    networks:
      - private
      - public
    restart: always

volumes:
  pgdata:
  redisdata:
  miniodata:

networks:
  # DB and Redis live only on this Docker network. MinIO also uses it for
  # backend traffic, while its second network makes the loopback port routable.
  private:
    internal: true
  # Backend/worker also need outbound internet access for external APIs.
  public:
