# Доверяем DDoS-Guard CDN как reverse-proxy: он терминирует TLS и
# подменяет src-IP на свой edge, а оригинальный клиент приходит
# в X-Forwarded-For. Без real_ip $remote_addr = edge DDoS-Guard'а,
# из-за чего IP-allowlist YooKassa-webhook'а отбивал легитимные
# нотификации (yookassa_webhook_ip_rejected).
#
# Сети AS262254 (DDoS-Guard Corp.). Диапазоны, присутствующие в
# access.log: 45.10.240.0/24, 186.2.160.0/24, 186.2.167.0/24,
# 186.2.168.0/24 — покрываются соответствующими /22.
set_real_ip_from 45.10.240.0/22;
set_real_ip_from 186.2.160.0/22;
set_real_ip_from 186.2.164.0/22;
set_real_ip_from 186.2.168.0/22;
set_real_ip_from 186.2.172.0/22;

real_ip_header    X-Forwarded-For;
real_ip_recursive on;
