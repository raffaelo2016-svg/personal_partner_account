# Rate-limit зоны объявляются в http-контексте (app.conf подключается
# из /etc/nginx/nginx.conf внутри http { include sites-enabled/*; }).
include /etc/nginx/snippets/limits.conf;

upstream backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP — только ACME-челлендж и редирект на HTTPS.
server {
    listen 80;
    server_name finzdorovie.ru www.finzdorovie.ru;

    include /etc/nginx/snippets/realip.conf;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name finzdorovie.ru www.finzdorovie.ru;

    include /etc/nginx/snippets/ssl.conf;
    include /etc/nginx/snippets/realip.conf;

    root /srv/personal_partner_account/frontend/dist;
    index index.html;

    client_max_body_size 50m;
    client_body_buffer_size 128k;
    large_client_header_buffers 4 16k;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header Referrer-Policy           "no-referrer" always;
    add_header X-Frame-Options           "DENY" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/xml+rss
        image/svg+xml;

    access_log /var/log/nginx/app.access.log;
    error_log  /var/log/nginx/app.error.log warn;

    location = /health {
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend/health;
    }

    # YooKassa webhook: без rate-limit (провайдер ретраит), без буферизации.
    location = /api/v1/webhooks/yookassa {
        include /etc/nginx/snippets/proxy.conf;
        proxy_buffering off;
        proxy_pass http://backend;
    }

    # Auth — более жёсткий rate-limit.
    location /api/v1/auth/ {
        limit_req zone=auth burst=10 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend;
    }

    # AI-ответы от OpenAI — увеличенный read timeout.
    location /api/v1/chat/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_read_timeout 180s;
        proxy_pass http://backend;
    }

    # Загрузка файлов (multipart, до 50 MB) — без request-буферизации.
    # Exact-match, чтобы nginx не делал 301 на канонизацию slash.
    location = /api/v1/upload {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=api burst=60 nodelay;
        include /etc/nginx/snippets/proxy.conf;
        proxy_pass http://backend;
    }

    # Публичный доступ к MinIO по presigned URL. Префикс = имя bucket'а —
    # nginx pass-through без изменения path, чтобы AWS SigV4-подпись
    # оставалась валидной. Host-заголовок MinIO приходит тот же, что
    # использовался при подписи (finzdorovie.ru).
    location /partner-cabinet/ {
        proxy_http_version 1.1;
        proxy_set_header Host            $host;
        proxy_set_header X-Real-IP       $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_pass http://127.0.0.1:9000;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        client_max_body_size 50m;
    }

    # WebSocket чата: backend маршрут — /api/v1/ws/chat (см. app/api/ws_chat.py).
    # longest-prefix-match выберет этот блок раньше "/api/" для ws-путей.
    location /api/v1/ws/ {
        limit_conn ws 5;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_pass http://backend;
    }

    # Vite-ассеты с хэшами в имени — immutable кэш.
    location ~* ^/assets/.+\.(js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
