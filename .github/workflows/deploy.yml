name: Deploy to production

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success')
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.check.outputs.deploy }}
      sha: ${{ steps.check.outputs.sha }}
    steps:
      - name: Require successful CI for the current main revision
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { data: branch } = await github.rest.repos.getBranch({
              ...context.repo, branch: 'main',
            });
            const sha = context.payload.workflow_run?.head_sha || context.sha;
            if (sha !== branch.commit.sha) {
              core.info('A newer main revision exists; skip the older deployment.');
              core.setOutput('deploy', 'false');
              return;
            }
            // Проверяем, что для этой ревизии прошёл CI. Для деплоя по push
            // смотрим именно тот прогон CI, который его запустил: раньше здесь
            // был поиск по списку завершённых run'ов, и он гонялся с индексом
            // GitHub API — деплой стартовал через пару секунд после CI и не
            // находил свой же run. Для ручного запуска берём последний успешный.
            const triggeredRunId = context.payload.workflow_run?.id;
            let ciSucceeded = false;

            if (triggeredRunId) {
              let run;
              for (let attempt = 0; attempt < 10; attempt += 1) {
                const { data } = await github.rest.actions.getWorkflowRun({
                  ...context.repo, run_id: triggeredRunId,
                });
                run = data;
                if (run.status === 'completed') break;
                await new Promise((resolve) => setTimeout(resolve, 3000));
              }
              ciSucceeded = !!run && run.head_sha === sha && run.conclusion === 'success';
              if (!ciSucceeded) {
                core.info(`CI run ${triggeredRunId}: sha=${run?.head_sha} conclusion=${run?.conclusion}`);
              }
            } else {
              const { data } = await github.rest.actions.listWorkflowRuns({
                ...context.repo, workflow_id: 'ci.yml', head_sha: sha,
                branch: 'main', event: 'push', status: 'completed', per_page: 100,
              });
              ciSucceeded = data.workflow_runs.some(
                (run) => run.head_sha === sha && run.conclusion === 'success',
              );
            }

            if (!ciSucceeded) {
              throw new Error('Deployment requires successful CI for this exact main revision.');
            }
            core.setOutput('sha', sha);
            core.setOutput('deploy', 'true');

  deploy:
    needs: validate
    if: needs.validate.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: SSH and run deploy.sh
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ needs.validate.outputs.sha }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          envs: DEPLOY_SHA
          script_stop: true
          command_timeout: 20m
          script: |
            set -e
            printf '%s\n' "$DEPLOY_SHA" | grep -Eq '^[0-9a-f]{40}$'
            cd /srv/personal_partner_account
            git fetch origin main
            test "$(git rev-parse origin/main)" = "$DEPLOY_SHA"
            git reset --hard "$DEPLOY_SHA"
            bash deploy/deploy.sh
