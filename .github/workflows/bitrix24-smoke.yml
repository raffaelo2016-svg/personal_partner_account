name: Bitrix24 production smoke

on:
  workflow_dispatch:
    inputs:
      manual_reverse_document:
        description: "Wait for a document added manually in the Bitrix24 deal UI"
        required: false
        default: false
        type: boolean

concurrency:
  group: bitrix24-production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Run synthetic task and document smoke
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script_stop: true
          command_timeout: 5m
          script: |
            set -e
            cd /srv/personal_partner_account
            MANUAL_ARG=""
            if [ "${{ inputs.manual_reverse_document }}" = "true" ]; then
              MANUAL_ARG="--manual-reverse-document"
            fi
            docker compose -f docker-compose.prod.yml exec -T backend \
              python -m app.integrations.bitrix24.smoke_cli $MANUAL_ARG
